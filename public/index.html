<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Review Assistant — Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --text: #e7e9ee;
    --muted: #9aa1ae;
    --accent: #6c8cff;
    --accent-hover: #5779e6;
    --danger: #ff6b6b;
    --success: #4dd08a;
    --new: #f5b301;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .setup {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 20px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .setup .field { flex: 1; min-width: 160px; }
  .setup label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .setup input, .setup select {
    width: 100%;
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 10px;
    font-size: 13px;
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stat-card .num { font-size: 26px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat-card.new .num { color: var(--new); }
  .panel { background: var(--card); border: 1px dashed var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .panel .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .panel input, .panel select, .panel textarea {
    background: #10131a; border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    padding: 8px 10px; font-size: 13px; font-family: inherit;
  }
  .panel .name-field { flex: 1; min-width: 220px; }
  .panel button { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .tabs { display: flex; gap: 18px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 8px 2px 10px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar button.chip {
    background: #10131a; border: 1px solid var(--border); color: var(--text);
    padding: 7px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
  }
  .toolbar button.chip:hover { border-color: var(--accent); }
  .toolbar .spacer { flex: 1; }
  .toolbar button.primary-action {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .toolbar button.primary-action:disabled { opacity: 0.4; cursor: not-allowed; }
  .toolbar button.primary-action:hover:not(:disabled) { background: var(--accent-hover); }
  .toolbar button.secondary-action {
    background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .toolbar button.secondary-action:disabled { opacity: 0.4; cursor: not-allowed; }
  .toolbar button.secondary-action:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .review-row { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .review-row.is-new { border-left: 3px solid var(--new); }
  .review-head { display: flex; align-items: flex-start; gap: 12px; }
  .review-head input[type="checkbox"] { margin-top: 4px; width: 16px; height: 16px; }
  .review-info { flex: 1; min-width: 0; }
  .review-info .top-line { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 4px; flex-wrap: wrap; }
  .review-info .name { font-weight: 600; }
  .stars { color: #f5b301; font-size: 12px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); }
  .badge.new { color: var(--new); border-color: var(--new); }
  .badge.ready { color: var(--accent); border-color: var(--accent); }
  .badge.sent { color: var(--success); border-color: var(--success); }
  .review-text { font-size: 13px; color: var(--muted); font-style: italic; }
  .draft-box { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .draft-box textarea {
    width: 100%; min-height: 80px; background: #10131a; border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 10px; font-size: 13px; font-family: inherit; resize: vertical;
  }
  .draft-actions { display: flex; gap: 8px; margin-top: 8px; }
  .draft-actions button { border: none; border-radius: 6px; padding: 7px 12px; font-size: 12px; cursor: pointer; }
  .btn-send { background: var(--success); color: #0a1a12; font-weight: 600; }
  .btn-send:disabled { background: var(--border); color: var(--muted); cursor: default; }
  .btn-regen { background: transparent; border: 1px solid var(--border) !important; color: var(--muted); }
  .send-note { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .error { color: var(--danger); font-size: 13px; margin: 10px 0; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Feedback Fox</h1>

  <div class="setup">
    <div class="field">
      <label>Virksomhedsnavn</label>
      <input id="businessName" value="Dit shop navn" />
    </div>
    <div class="field">
      <label>Branche</label>
      <input id="businessType" value="café" />
    </div>
    <div class="field">
      <label>Tone</label>
      <select id="tone">
        <option value="venligt og professionelt">Venligt og professionelt</option>
        <option value="afslappet og personligt">Afslappet og personligt</option>
        <option value="formelt">Formelt</option>
      </select>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card new"><div class="num" id="statNew">0</div><div class="label">Nye siden sidst</div></div>
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Anmeldelser i alt</div></div>
    <div class="stat-card"><div class="num" id="statSent">0</div><div class="label">Besvarede</div></div>
  </div>

  <div class="panel" id="placesPanel">
    <div class="row">
      <input class="name-field" id="placesQuery" placeholder="Søg din virksomhed på Google (fx 'Café Nordvest København')" />
      <button id="placesSearchBtn" type="button">Søg på Google</button>
    </div>
    <div id="placesResults"></div>
    <div class="row" id="placesFetchRow" style="display:none; align-items:center; margin-top:8px;">
      <button id="placesFetchBtn" type="button">Hent seneste anmeldelser</button>
      <span class="send-note" style="margin:0;">⚠ Google udstiller maks. 5 anmeldelser pr. sted via denne API — ikke alle jeres.</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="unanswered">Nye / ubesvarede</button>
    <button class="tab-btn" data-tab="answered">Besvarede</button>
  </div>

  <div class="toolbar">
    <label id="selectAllWrap" style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer;">
      <input type="checkbox" id="selectAllCheck" />
      Markér alle
    </label>
    <button class="chip" data-filter="all">Alle</button>
    <button class="chip" data-filter="5">★★★★★</button>
    <button class="chip" data-filter="4">★★★★☆</button>
    <button class="chip" data-filter="low">≤3 stjerner</button>
    <div class="spacer"></div>
    <button class="secondary-action" id="bulkMarkAnswered" disabled>Markér som besvaret (0)</button>
    <button class="primary-action" id="bulkGenerate" disabled>Generér svar for valgte (0)</button>
  </div>

  <div id="error" class="error"></div>
  <div id="reviewList"></div>
  <div id="emptyState" class="empty" style="display:none;"></div>
</div>

<script>
  let reviews = [];
  // Sættes når man har valgt et sted. Alt der skal gemmes hænger på denne —
  // uden den ved serveren ikke hvilken restaurant en anmeldelse hører til.
  let currentRestaurantId = null;
  let currentFilter = "all";
  let currentTab = "unanswered";

  const reviewList = document.getElementById("reviewList");
  const emptyState = document.getElementById("emptyState");
  const errorDiv = document.getElementById("error");

  // Alt der kommer udefra (anmeldernes navne og tekster fra Google, Claudes
  // udkast, stednavne) skal renses før det sættes ind som HTML. Ellers kan en
  // anmeldelse med <img src=x onerror=...> køre kode i ejerens browser — og nu
  // hvor anmeldelser gemmes i databasen, sker det hver gang siden åbnes.
  function esc(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function starString(n) {
    n = Number(n);
    return "★".repeat(n) + "☆".repeat(5 - n);
  }

  // Serveren svarer altid med {error} ved fejl. Uden denne ville en fejlet
  // gemning se ud som om den lykkedes, fordi fetch kun kaster ved netværksfejl
  // — ikke ved 400 og 500.
  async function postJson(url, body) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Serverfejl (${res.status})`);
    return data;
  }

  async function getJson(url) {
    const res = await fetch(url);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Serverfejl (${res.status})`);
    return data;
  }

  function updateStats() {
    document.getElementById("statNew").textContent = reviews.filter(r => r.status === "new").length;
    document.getElementById("statTotal").textContent = reviews.length;
    document.getElementById("statSent").textContent = reviews.filter(r => r.status === "sent").length;
  }

  function filteredReviews() {
    const base = currentTab === "answered"
      ? reviews.filter(r => r.status === "sent")
      : reviews.filter(r => r.status !== "sent");
    if (currentFilter === "all") return base;
    if (currentFilter === "low") return base.filter(r => Number(r.rating) <= 3);
    return base.filter(r => String(r.rating) === currentFilter);
  }

  function render() {
    updateStats();
    const list = filteredReviews();
    reviewList.innerHTML = "";
    emptyState.style.display = list.length === 0 ? "block" : "none";
    emptyState.textContent = currentTab === "answered"
      ? "Ingen besvarede anmeldelser endnu."
      : "Ingen anmeldelser endnu — søg din virksomhed ovenfor for at hente anmeldelser fra Google.";

    list.forEach(r => {
      const row = document.createElement("div");
      row.className = "review-row" + (r.status === "new" ? " is-new" : "");

      const badge = r.status === "new" ? '<span class="badge new">Ny</span>'
        : r.status === "ready" ? '<span class="badge ready">Udkast klar</span>'
        : r.status === "sent" ? '<span class="badge sent">✓ Besvaret</span>'
        : '';

      let draftSection = "";
      if (r.status === "sent") {
        if (r.draft) {
          draftSection = `
            <div class="draft-box">
              <div class="review-text" style="font-style: normal;">${esc(r.draft)}</div>
            </div>
          `;
        }
      } else if (r.draft) {
        draftSection = `
          <div class="draft-box">
            <textarea class="draftText" data-id="${esc(r.id)}">${esc(r.draft)}</textarea>
            <div class="draft-actions">
              <button class="btn-send" data-id="${esc(r.id)}">Send til Google</button>
              <button class="btn-regen" data-id="${esc(r.id)}">Generér igen</button>
            </div>
            <div class="send-note">⚠ Prototype: "Send" kopierer svaret til udklipsholder for nu — automatisk afsendelse til Google kræver godkendt Business Profile API-adgang (se README).</div>
          </div>
        `;
      }

      row.innerHTML = `
        <div class="review-head">
          ${currentTab === "unanswered" ? `<input type="checkbox" class="rowCheck" data-id="${esc(r.id)}" />` : ""}
          <div class="review-info">
            <div class="top-line">
              <span class="name">${esc(r.reviewerName) || "Anonym"}</span>
              <span class="stars">${starString(r.rating)}</span>
              ${badge}
            </div>
            <div class="review-text">"${esc(r.reviewText)}"</div>
          </div>
        </div>
        ${draftSection}
      `;
      reviewList.appendChild(row);
    });

    updateBulkButtons();
  }

  function updateBulkButtons() {
    const all = document.querySelectorAll(".rowCheck");
    const checked = document.querySelectorAll(".rowCheck:checked").length;
    const generateBtn = document.getElementById("bulkGenerate");
    const markBtn = document.getElementById("bulkMarkAnswered");
    generateBtn.textContent = `Generér svar for valgte (${checked})`;
    generateBtn.disabled = checked === 0;
    markBtn.textContent = `Markér som besvaret (${checked})`;
    markBtn.disabled = checked === 0;

    const selectAllCheck = document.getElementById("selectAllCheck");
    selectAllCheck.checked = all.length > 0 && checked === all.length;
    selectAllCheck.indeterminate = checked > 0 && checked < all.length;
  }

  document.getElementById("selectAllCheck").addEventListener("change", (e) => {
    document.querySelectorAll(".rowCheck").forEach(cb => cb.checked = e.target.checked);
    updateBulkButtons();
  });

  reviewList.addEventListener("change", (e) => {
    if (e.target.classList.contains("rowCheck")) updateBulkButtons();
    if (e.target.classList.contains("draftText")) {
      // Kun lokalt mens man skriver. Teksten gemmes når man trykker "Send" —
      // ellers ville hvert tastetryk blive et kald til serveren.
      const r = reviews.find(x => x.id === e.target.dataset.id);
      if (r) r.draft = e.target.value;
    }
  });

  reviewList.addEventListener("click", async (e) => {
    const id = e.target.dataset.id;
    if (e.target.classList.contains("btn-send")) {
      const r = reviews.find(x => x.id === id);
      if (!r) return;

      // Teksten læses fra feltet frem for fra r.draft: har man rettet i den og
      // ikke forladt feltet endnu, er change-eventet ovenfor ikke nået at køre,
      // og så ville vi gemme den gamle tekst.
      const field = document.querySelector(`.draftText[data-id="${id}"]`);
      const finalText = field ? field.value : r.draft;

      navigator.clipboard.writeText(finalText);
      try {
        await postJson(`/api/reviews/${id}/send`, { finalText });
        r.draft = finalText;
        r.status = "sent";
        render();
      } catch (err) {
        errorDiv.textContent = "Kunne ikke gemme svaret: " + err.message;
      }
    }
    if (e.target.classList.contains("btn-regen")) {
      generateFor([id]);
    }
  });

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentTab = btn.dataset.tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("bulkGenerate").style.display = currentTab === "answered" ? "none" : "";
      document.getElementById("bulkMarkAnswered").style.display = currentTab === "answered" ? "none" : "";
      document.getElementById("selectAllWrap").style.display = currentTab === "answered" ? "none" : "flex";
      render();
    });
  });

  document.querySelectorAll(".toolbar .chip").forEach(chip => {
    chip.addEventListener("click", () => {
      currentFilter = chip.dataset.filter;
      document.querySelectorAll(".toolbar .chip").forEach(c => c.style.borderColor = "");
      chip.style.borderColor = "var(--accent)";
      render();
    });
  });

  document.getElementById("bulkGenerate").addEventListener("click", () => {
    const ids = Array.from(document.querySelectorAll(".rowCheck:checked")).map(cb => cb.dataset.id);
    generateFor(ids);
  });

  document.getElementById("bulkMarkAnswered").addEventListener("click", async () => {
    errorDiv.textContent = "";
    const ids = Array.from(document.querySelectorAll(".rowCheck:checked")).map(cb => cb.dataset.id);

    try {
      // Først når serveren har bekræftet hver enkelt, flyttes den i listen.
      // Ellers ville en anmeldelse se besvaret ud indtil man genindlæste siden.
      for (const id of ids) {
        await postJson(`/api/reviews/${id}/answered`, {});
        const r = reviews.find(x => x.id === id);
        if (r) r.status = "sent";
      }
      render();
    } catch (err) {
      errorDiv.textContent = "Kunne ikke markere som besvaret: " + err.message;
      render();
    }
  });

  async function generateFor(ids) {
    errorDiv.textContent = "";
    const businessName = document.getElementById("businessName").value.trim();
    const businessType = document.getElementById("businessType").value.trim();
    const tone = document.getElementById("tone").value;

    const toGenerate = reviews.filter(r => ids.includes(r.id));
    if (toGenerate.length === 0) return;

    const btn = document.getElementById("bulkGenerate");
    btn.disabled = true;
    btn.textContent = "Genererer...";

    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          businessName, businessType, tone,
          // Sendes med så serveren kan huske tonen til næste gang.
          restaurantId: currentRestaurantId,
          reviews: toGenerate.map(r => ({ id: r.id, reviewerName: r.reviewerName, rating: r.rating, reviewText: r.reviewText })),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Ukendt fejl");

      data.results.forEach(result => {
        const r = reviews.find(x => x.id === result.id);
        if (r) {
          r.draft = result.draft;
          r.status = "ready";
        }
      });
      render();
    } catch (err) {
      errorDiv.textContent = "Fejl: " + err.message;
    } finally {
      updateBulkButtons();
    }
  }

  let selectedPlaceId = null;

  async function searchPlaces() {
    errorDiv.textContent = "";
    const query = document.getElementById("placesQuery").value.trim();
    if (!query) return;

    const resultsDiv = document.getElementById("placesResults");
    resultsDiv.innerHTML = "<div class=\"send-note\">Søger...</div>";
    document.getElementById("placesFetchRow").style.display = "none";
    selectedPlaceId = null;

    try {
      const res = await fetch(`/api/places/search?query=${encodeURIComponent(query)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Ukendt fejl");

      if (data.places.length === 0) {
        resultsDiv.innerHTML = "<div class=\"send-note\">Ingen resultater — prøv et mere præcist navn eller tilføj by/adresse.</div>";
        return;
      }

      resultsDiv.innerHTML = "";
      data.places.forEach(place => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.style.display = "block";
        btn.style.width = "100%";
        btn.style.textAlign = "left";
        btn.style.marginTop = "6px";
        btn.innerHTML = `<strong>${esc(place.name)}</strong><br><span style="color:var(--muted); font-size:11px;">${esc(place.address)}</span>`;
        btn.addEventListener("click", () => {
          selectedPlaceId = place.placeId;
          document.querySelectorAll("#placesResults .chip").forEach(c => c.style.borderColor = "");
          btn.style.borderColor = "var(--accent)";
          document.getElementById("placesFetchRow").style.display = "flex";
          if (place.name) document.getElementById("businessName").value = place.name;
        });
        resultsDiv.appendChild(btn);
      });
    } catch (err) {
      errorDiv.textContent = "Fejl: " + err.message;
      resultsDiv.innerHTML = "";
    }
  }

  document.getElementById("placesSearchBtn").addEventListener("click", searchPlaces);
  document.getElementById("placesQuery").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      searchPlaces();
    }
  });

  document.getElementById("placesFetchBtn").addEventListener("click", async () => {
    errorDiv.textContent = "";
    if (!selectedPlaceId) return;

    const btn = document.getElementById("placesFetchBtn");
    btn.disabled = true;
    btn.textContent = "Henter...";

    try {
      const businessType = document.getElementById("businessType").value.trim();
      const before = reviews.length;

      const data = await getJson(
        `/api/places/reviews?placeId=${encodeURIComponent(selectedPlaceId)}` +
        `&businessType=${encodeURIComponent(businessType)}`
      );

      // Serveren har allerede gemt og flettet — listen erstattes derfor helt
      // frem for at vi selv fletter her. Dubletter håndteres af databasen, og
      // svaret indeholder også ældre anmeldelser som Google ikke sender mere.
      applyRestaurantData(data);

      if (reviews.length === before) {
        errorDiv.textContent = "Ingen nye anmeldelser at hente (de var allerede gemt).";
      }
    } catch (err) {
      errorDiv.textContent = "Fejl: " + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "Hent seneste anmeldelser";
    }
  });

  // Ét sted der tager et serversvar og gør det til appens tilstand — bruges
  // både når man henter fra Google og når siden indlæser gemte data.
  function applyRestaurantData(data) {
    currentRestaurantId = data.restaurantId;
    reviews = data.reviews;

    if (data.businessName) document.getElementById("businessName").value = data.businessName;
    if (data.businessType) document.getElementById("businessType").value = data.businessType;
    if (data.defaultTone) document.getElementById("tone").value = data.defaultTone;

    render();
  }

  // Det der gør databasen synlig i appen: uden denne ville siden starte tom
  // hver gang, uanset hvor meget der lå gemt.
  async function loadSavedWork() {
    try {
      const { restaurants } = await getJson("/api/restaurants");
      if (restaurants.length === 0) return;

      // Listen kommer sorteret med senest opdaterede først, så det man sidst
      // arbejdede på er det der åbner.
      const data = await getJson(`/api/restaurants/${restaurants[0].id}/reviews`);
      applyRestaurantData(data);
    } catch (err) {
      errorDiv.textContent = "Kunne ikke hente gemte anmeldelser: " + err.message;
    }
  }

  render();
  loadSavedWork();
</script>
</body>
</html>
